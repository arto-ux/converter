<body>

    <!-- tool -->
    <div class="container">
        <h1>Dyslexia-Friendly Text Converter</h1>
        <div id="input-text" class="editable-div" contenteditable="true" placeholder="Paste your text here..." role="textbox" aria-label="Input text area" autofocus></div>
        <div class="btn-group">
            <button 
                id="convert-btn" 
                aria-label="Convert text"
            >Convert</button>
            <button 
                id="clear-btn" 
                aria-label="Clear text"
            >Clear</button>
        </div>
        <div id="output-text" role="region" aria-label="Converted text output"></div>
    </div>

    <script>
        document.getElementById('input-text').addEventListener('paste', function (e) {
            e.preventDefault();

            // Get the pasted content as HTML or plain text
            const pastedHTML = (e.clipboardData || window.clipboardData).getData('text/html') || 
                            (e.clipboardData || window.clipboardData).getData('text');

            // Create a temporary element to parse the HTML
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = pastedHTML;

            // Function to sanitize content
            const sanitizeContent = (element) => {
                // List of tags to remove entirely
                const unwantedTags = ['img', 'iframe', 'script', 'embed', 'object', 'style', 'link', 'canvas', 'figure', 'select', 'input', 'svg'];

                // Remove unwanted tags completely
                unwantedTags.forEach(tag => {
                    const elements = element.querySelectorAll(tag);
                    elements.forEach(el => el.remove());
                });

                // Replace <a> and <button> with their text content
                const replaceableTags = ['a', 'button'];
                replaceableTags.forEach(tag => {
                    const elements = element.querySelectorAll(tag);
                    elements.forEach(el => {
                        const textNode = document.createTextNode(el.textContent);
                        el.replaceWith(textNode);
                    });
                });

                // Remove inline styles
                element.removeAttribute('style');

                // Recursively sanitize child nodes
                for (const child of element.children) {
                    sanitizeContent(child);
                }
            };

            // Sanitize the content
            sanitizeContent(tempDiv);

            // Insert sanitized content into the input text area
            document.execCommand('insertHTML', false, tempDiv.innerHTML);
        });

    </script>

    <script>
        // Disable right-click
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Disable F12, Ctrl+Shift+I, Ctrl+U, Ctrl+Shift+C
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || // F12
                (e.ctrlKey && e.shiftKey && e.keyCode == 73) || // Ctrl+Shift+I
                (e.ctrlKey && e.shiftKey && e.keyCode == 67) || // Ctrl+Shift+C
                (e.ctrlKey && e.keyCode == 85)) { // Ctrl+U
                return false;
            }
        };   
    </script>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('active');
        }

        // Highlight the active link based on the URL hash
        const links = document.querySelectorAll('.menu a, .mobile-menu a');
        links.forEach(link => {
            link.addEventListener('click', () => {
                links.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
        });
    </script>

    <script>
        // Configure Hyphenator.js
        Hyphenator.config({
        displaytogglebox: false,
        minwordlength: 4,
        hyphenchar: '-'
        });

        // Add exceptions for specific words
        Hyphenator.addExceptions('en', 'title succeed proceed exceed little subtle castle bottle gentle');

        function wrapHyphenatedSyllablesWithStyle(element) {
        Array.from(element.childNodes).forEach(node => {
            if (node.nodeType === Node.TEXT_NODE) {
            const fragment = document.createDocumentFragment();
            const words = node.textContent.match(/\b[\w']+\b/g) || [];

            words.forEach(word => {
                const syllables = Hyphenator.hyphenate(word, 'en').split('-');
                const wordSpan = document.createElement('span');
                wordSpan.className = 'word';

                syllables.forEach(syllable => {
                const syllableSpan = document.createElement('span');
                syllableSpan.className = 'syllable';
                syllableSpan.textContent = syllable;
                wordSpan.appendChild(syllableSpan);
                });

                fragment.appendChild(wordSpan);
            });

            node.parentNode.replaceChild(fragment, node);
            } else if (node.nodeType === Node.ELEMENT_NODE) {
            wrapHyphenatedSyllablesWithStyle(node);
            }
        });
        }

        function applySequentialBackgroundColors() {
        const colors = [
            'hsl(168, 90%, 90%)', 'hsl(188, 90%, 90%)', 'hsl(208, 90%, 90%)',
            'hsl(228, 90%, 90%)', 'hsl(248, 90%, 90%)', 'hsl(268, 90%, 90%)',
            'hsl(288, 90%, 90%)', 'hsl(308, 90%, 90%)', 'hsl(328, 90%, 90%)'
        ];

        const words = document.querySelectorAll('.word');
        words.forEach((word, index) => {
            word.style.backgroundColor = colors[index % colors.length];
        });
        }

        document.getElementById('convert-btn').addEventListener('click', function () {
        const inputElement = document.getElementById('input-text');
        const outputElement = document.getElementById('output-text');
        outputElement.innerHTML = inputElement.innerHTML;

        // Show progress bar
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        progressBar.style.display = 'block';
        progress.style.width = '0%';

        // Simulate progress
        let width = 0;
        const interval = setInterval(() => {
            if (width >= 100) {
            clearInterval(interval);
            progressBar.style.display = 'none'; // Hide progress bar after completion
            } else {
            width++;
            progress.style.width = width + '%';
            }
        }, 10); // Adjust speed of progress

        // Run Hyphenator and wrap the content
        Hyphenator.run();
        wrapHyphenatedSyllablesWithStyle(outputElement);
        applySequentialBackgroundColors();
        });

        document.getElementById('clear-btn').addEventListener('click', function () {
        document.getElementById('input-text').innerHTML = '';
        document.getElementById('output-text').innerHTML = '';
        document.getElementById('progressBar').style.display = 'none'; // Hide progress bar on clear
        });

        document.addEventListener('keydown', function (e) {
        if (e.ctrlKey && e.key === 'Enter') {
            document.getElementById('convert-btn').click();
        }
        if (e.ctrlKey && e.key === 'Delete') {
            document.getElementById('clear-btn').click();
        }
        });
    </script>
